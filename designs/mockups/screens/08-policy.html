<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<title>Banquet Copilot: policy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Tokens from designs/posthog/DESIGN.md (npx getdesign add posthog). */
:root {
  --primary: #f7a501;
  --primary-pressed: #dd9001;
  --ink: #23251d;
  --body: #4d4f46;
  --mute: #6c6e63;
  --ash: #9b9c92;
  --hairline: #bfc1b7;
  --hairline-soft: #dcdfd2;
  --canvas: #eeefe9;
  --soft: #e5e7e0;
  --card: #ffffff;
  --doc: #fcfcfa;
  --dark: #23251d;
  --link: #1078a3;
  --blue: #2c84e0;
  --blue-soft: #dceaf6;
  --red: #cd4239;
  --red-soft: #f7d6d3;
  --green: #2c8c66;
  --green-soft: #d9eddf;
  --purple: #7c44a6;
  --purple-soft: #e7d8ee;
  --font: "IBM Plex Sans", -apple-system, system-ui, sans-serif;
  --mono: "Source Code Pro", ui-monospace, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: var(--font); font-size: 15px; line-height: 1.5; color: var(--body); background: #dcdfd2; -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; }
h1, h2, h3 { color: var(--ink); margin: 0; }
h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.33; }
h2 { font-size: 21px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.4; }
h3 { font-size: 16px; font-weight: 600; line-height: 1.5; }

/* canvas */
.canvas { padding: 40px 48px 80px; }
.canvas-head { margin-bottom: 40px; }
.canvas-head h1 { font-size: 36px; font-weight: 700; letter-spacing: 0; }
.screen-sec { margin-bottom: 80px; }
.screen-sec > h2 { margin-bottom: 14px; }
.frames { display: flex; gap: 40px; align-items: flex-start; }
.frame-label { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--mute); margin-bottom: 8px; }
.frame { background: var(--canvas); overflow: hidden; border: 1px solid var(--hairline); border-radius: 8px; }
.frame.desktop { width: 1280px; height: 820px; }
.frame.mobile { width: 390px; height: 844px; border-radius: 40px; border: 9px solid var(--dark); }

/* logo */
.lockup { display: flex; align-items: center; gap: 8px; }
.lockup b { font-size: 16px; font-weight: 800; color: var(--ink); letter-spacing: -0.3px; }

/* shell */
.shell { display: flex; height: 100%; }
.side { width: 240px; flex-shrink: 0; display: flex; flex-direction: column; padding: 14px 10px; gap: 2px; border-right: 1px solid var(--hairline-soft); }
.side .lockup { padding: 2px 8px 14px; }
.switch { display: flex; align-items: center; gap: 8px; border: 1px solid var(--hairline); background: var(--card); border-radius: 6px; padding: 6px 8px; margin-bottom: 10px; font-size: 14px; font-weight: 600; color: var(--ink); }
.switch .sq { width: 22px; height: 22px; border-radius: 4px; background: var(--dark); color: #fff; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
.side a { display: flex; align-items: center; gap: 9px; padding: 6px 8px; border-radius: 6px; font-size: 14px; font-weight: 500; color: var(--body); }
.side a.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px var(--hairline); }
.side a .n { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--ink); background: var(--primary); border-radius: 4px; padding: 0 6px; }
.side a.sub { padding-left: 35px; font-size: 13.5px; color: var(--mute); }
.side .sec { font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--ash); padding: 14px 8px 4px; }
.side .gap { height: 14px; }
.side .me { margin-top: auto; display: flex; align-items: center; gap: 8px; padding: 6px 8px; font-size: 14px; font-weight: 600; color: var(--ink); }
.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
.head { padding: 22px 28px 0; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.filters { display: flex; gap: 8px; align-items: center; padding: 14px 28px 0; }
.content { flex: 1; overflow: hidden; padding: 18px 28px 28px; }

/* mobile shell */
.mshell { display: flex; flex-direction: column; height: 100%; }
.mstatus { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 14px; font-weight: 600; color: var(--ink); flex-shrink: 0; }
.mbar { display: flex; align-items: center; gap: 12px; padding: 4px 16px 12px; flex-shrink: 0; }
.mcontent { flex: 1; overflow: hidden; padding: 4px 14px 0; }
.mtabs { height: 78px; display: flex; border-top: 1px solid var(--hairline-soft); padding: 8px 6px 20px; flex-shrink: 0; }
.mtabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; color: var(--mute); position: relative; }
.mtabs a.on { color: var(--ink); font-weight: 700; }
.mtabs a .n { position: absolute; top: -4px; right: 18px; font-size: 10px; font-weight: 700; background: var(--primary); color: var(--ink); border-radius: 4px; padding: 0 4px; }

/* buttons */
.btn { height: 40px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--soft); color: var(--ink); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--primary); }
.btn.ghost { background: transparent; }
.btn.danger { background: transparent; color: var(--red); }
.btn.full { width: 100%; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.fbtn { height: 32px; padding: 0 10px; border: 1px solid var(--hairline); border-radius: 6px; background: var(--card); font-size: 13px; font-weight: 500; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; }

/* surfaces */
.card { background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; }
.tile { background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; display: flex; flex-direction: column; min-width: 0; }
.tile-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px 0; }
.tile-h .bar { display: none; }
.tile-h .act { margin-left: auto; font-size: 13px; color: var(--mute); }
.tile-b { padding: 12px 16px 16px; flex: 1; min-height: 0; }
.big { font-size: 64px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: var(--ink); }
.callout { border-radius: 6px; padding: 12px 16px; font-size: 14px; color: var(--ink); }
.callout.blue { background: var(--blue-soft); }
.callout.red { background: var(--red-soft); }
.callout.green { background: var(--green-soft); }
.callout.yellow { background: #fbe7bd; }
.dashed { border: 1px dashed var(--hairline); border-radius: 6px; }

/* badges */
.stamp { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; line-height: 1; padding: 5px 7px; border-radius: 4px; white-space: nowrap; }
.stamp.order { color: var(--green); background: var(--green-soft); }
.stamp.ask { color: #7a4d00; background: #fbe7bd; }
.stamp.block { color: var(--red); background: var(--red-soft); }
.stamp.unknown { color: var(--mute); background: transparent; box-shadow: inset 0 0 0 1px var(--hairline); }
.stamp.info { color: var(--blue); background: var(--blue-soft); }
.tag { display: inline-block; font-size: 12.5px; font-weight: 500; color: var(--body); background: var(--soft); border-radius: 4px; padding: 1px 8px; }

/* price */
.price { font-weight: 700; color: var(--ink); line-height: 1; white-space: nowrap; letter-spacing: -0.5px; }
.price sup { font-size: 0.55em; vertical-align: 0.6em; margin-left: 1px; }
.price .cur { font-size: 0.6em; margin-left: 2px; }
.unitp { font-size: 12px; color: var(--mute); white-space: nowrap; }
.pricetag { display: inline-block; background: var(--primary); border-radius: 6px; padding: 6px 10px; }

/* table */
table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; font-weight: 600; text-transform: uppercase; color: var(--mute); padding: 0 12px 8px; border-bottom: 1px solid var(--hairline); }
table.t td { padding: 11px 12px; border-bottom: 1px solid var(--hairline-soft); vertical-align: middle; color: var(--ink); }
table.t tr:last-child td { border-bottom: 0; }
table.t tr.dim td { color: var(--ash); }
.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--mute); }
.small { font-size: 13px; }
.row { display: flex; gap: 10px; align-items: center; }
.grid { display: grid; gap: 16px; }
.stack > * + * { margin-top: 12px; }
.ic { flex-shrink: 0; }
.li { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--hairline-soft); align-items: center; }
.li:last-child { border-bottom: 0; }
.avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--soft); color: var(--ink); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex-shrink: 0; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 6px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--mute); }
.kv dd { margin: 0; color: var(--ink); font-weight: 500; }

/* cut-off board */
.board { background: var(--dark); color: #e9eae4; border-radius: 6px; padding: 6px 14px; font-family: var(--mono); font-size: 13px; }
.board .br { display: grid; grid-template-columns: minmax(0, 1fr) auto 70px; gap: 12px; padding: 9px 0; border-bottom: 1px solid #3a3c33; white-space: nowrap; }
.board .br:last-child { border-bottom: 0; }
.board .t { color: var(--primary); }
.board .left { text-align: right; color: #fff; }
.board .gone { text-align: right; color: #f08c84; }

/* stepper, toggle, seg */
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--hairline); border-radius: 6px; background: var(--card); height: 32px; overflow: hidden; }
.stepper b { width: 28px; text-align: center; color: var(--mute); font-weight: 500; }
.stepper span { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--ink); min-width: 64px; text-align: center; }
.toggle { width: 34px; height: 20px; border-radius: 10px; background: var(--hairline); position: relative; flex-shrink: 0; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; }
.toggle.on { background: var(--ink); }
.toggle.on::after { left: 17px; }
.seg { display: inline-flex; background: var(--soft); border-radius: 6px; padding: 3px; }
.seg span { padding: 5px 12px; font-size: 13px; font-weight: 600; color: var(--body); border-radius: 4px; }
.seg span.on { background: var(--card); color: var(--ink); box-shadow: inset 0 0 0 1px var(--hairline); }

/* chat */
.chathome { display: flex; flex-direction: column; align-items: center; text-align: center; }
.chathome h2 { font-size: 36px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.25; }
.composer { width: 100%; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; text-align: left; }
.composer .ctx { display: flex; gap: 6px; padding: 10px 12px 0; }
.composer .add { border: 1px solid var(--hairline); border-radius: 4px; font-size: 13px; padding: 1px 8px; color: var(--body); display: inline-flex; gap: 4px; align-items: center; }
.composer .txt { padding: 8px 10px 10px 12px; font-size: 16px; display: flex; align-items: flex-end; gap: 12px; color: var(--ink); }
.composer .txt span { flex: 1; padding-bottom: 6px; }
.composer .ph { color: var(--ash); }
.send { width: 38px; height: 38px; border-radius: 6px; background: var(--soft); display: grid; place-items: center; flex-shrink: 0; color: var(--ink); }
.send.go { background: var(--primary); }
.sugg { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.sugg span { border: 1px solid var(--hairline); background: var(--card); border-radius: 6px; padding: 6px 12px; font-size: 14px; font-weight: 500; color: var(--ink); }
.msg-me { margin-left: auto; background: var(--card); border: 1px solid var(--hairline); border-radius: 6px; padding: 10px 14px; max-width: 70%; color: var(--ink); }
.msg-ai { display: flex; gap: 12px; align-items: flex-start; color: var(--ink); font-size: 15.5px; }
.steps { font-size: 13px; color: var(--mute); display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }

/* records */
.receipt { background: var(--doc); font-family: var(--mono); font-size: 13px; color: var(--ink); padding: 20px; border: 1px solid var(--hairline); border-radius: 6px; }
.receipt .rl { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.receipt hr { border: 0; border-top: 1px dashed var(--hairline); margin: 10px 0; }
.arow { display: grid; grid-template-columns: 74px 110px 1fr; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--hairline-soft); font-size: 14px; color: var(--ink); }
.arow:last-child { border-bottom: 0; }
.code { background: var(--dark); color: #fff; border-radius: 6px; padding: 16px 20px; font-family: var(--mono); font-size: 13px; line-height: 1.5; white-space: pre; overflow: hidden; }
.code .k { color: #9cc3f0; }
.code .s { color: #a6d6b8; }
.method { font-family: var(--mono); font-size: 11px; font-weight: 600; padding: 2px 6px; border-radius: 4px; }
.method.get { color: var(--green); background: var(--green-soft); }
.method.post { color: var(--blue); background: var(--blue-soft); }
.chk { display: flex; gap: 8px; align-items: center; padding: 4px 0; font-size: 14px; color: var(--ink); }
.tick { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: var(--green); flex-shrink: 0; }
.tick.warn { background: var(--primary); }
.tick.no { background: var(--red); }
.fn { font-size: 10px; color: var(--mute); vertical-align: 0.5em; }
.right { margin-left: auto; font-size: 13px; color: var(--mute); display: flex; gap: 6px; align-items: center; }
.composer .txt .send { flex: none; padding: 0; }
</style></head><body><div id="root"></div>
